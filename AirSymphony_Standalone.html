<body class="selection:bg-cyan-500 selection:text-black min-h-screen flex flex-col">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    // SCALES AND NOTES
    const ROOT_NOTES = ['C', 'C#', 'D', 'Eb', 'E', 'F', 'F#', 'G', 'Ab', 'A', 'Bb', 'B'];
    const SCALES = {
      major: {
        name: 'Major (Ionian)',
        intervals: [0, 2, 4, 5, 7, 9, 11],
        chordQualities: ['maj', 'min', 'min', 'maj', 'maj', 'min', 'dim'],
        degrees: ['I', 'ii', 'iii', 'IV', 'V', 'vi', 'vii°']
      },
      minor: {
        name: 'Natural Minor (Aeolian)',
        intervals: [0, 2, 3, 5, 7, 8, 10],
        chordQualities: ['min', 'dim', 'maj', 'min', 'min', 'maj', 'maj'],
        degrees: ['i', 'ii°', 'III', 'iv', 'v', 'VI', 'VII']
      },
      pentatonic: {
        name: 'Pentatonic (Never hits a wrong note)',
        intervals: [0, 2, 4, 7, 9],
        chordQualities: ['maj', 'min', 'min', 'maj', 'min'],
        degrees: ['I', 'ii', 'iii', 'V', 'vi']
      }
    };

    const HAND_CONNECTIONS = [
      [0, 1], [1, 2], [2, 3], [3, 4],
      [0, 5], [5, 6], [6, 7], [7, 8],
      [0, 9], [9, 10], [10, 11], [11, 12],
      [0, 13], [13, 14], [14, 15], [15, 16],
      [0, 17], [17, 18], [18, 19], [19, 20],
      [5, 9], [9, 13], [13, 17]
    ];

    // ============================================================================
    // DEDICATED ACOUSTIC GUITAR PHYSICAL MODELING ENGINE
    // Karplus-Strong physical string models (Tone.PluckSynth pool) + Dreadnought
    // wooden soundhole resonance + pick scrape transients + room reverb
    // ============================================================================
    class AcousticGuitarEngine {
      constructor(roomReverb) {
        this.name = 'AcousticGuitarEngine';
        this.roomReverb = roomReverb;

        // 1. Acoustic Dreadnought Body Soundhole Filter & Resonance EQ
        this.bodyFilter = new Tone.Filter({
          frequency: 4200,
          type: 'lowpass',
          rolloff: -12,
          Q: 1.5
        });

        this.bodyEQ = new Tone.EQ3({
          low: 4.5,       // Warm 140Hz dreadnought body & soundhole air resonance
          mid: 2.2,       // Crisp steel-string pick attack presence (2.2kHz)
          high: -2.0,     // Warm acoustic roll-off above 4.5kHz
          lowFrequency: 180,
          highFrequency: 4500
        });

        this.bodyFilter.connect(this.bodyEQ);
        if (this.roomReverb) {
          this.bodyEQ.connect(this.roomReverb);
        }

        // 2. Karplus-Strong PluckSynth physical string voice pool (12 voices for rich polyphony)
        this.voicePoolSize = 12;
        this.pluckVoices = [];
        this.voiceIndex = 0;

        for (let i = 0; i < this.voicePoolSize; i++) {
          try {
            const v = new Tone.PluckSynth({
              attackNoise: 2.2, // Authentic acoustic pick strike on steel string
              dampening: 3600,  // Realistic steel/bronze string frequency-dependent damping
              resonance: 0.975, // Rich acoustic body sustain
              release: 1.4
            });
            v.volume.value = 1.5;
            v.connect(this.bodyFilter);
            this.pluckVoices.push(v);
          } catch (e) {
            console.warn('[AcousticGuitarEngine] PluckSynth voice init:', e);
          }
        }

        // 3. Companion Acoustic Wooden Body Resonance PolySynth layer
        this.resonanceSynth = new Tone.PolySynth(Tone.Synth, {
          oscillator: {
            type: 'triangle8' // Rich warm acoustic overtone series
          },
          envelope: {
            attack: 0.002, // Crisp pick pluck
            decay: 2.4,    // Natural guitar acoustic decay
            sustain: 0.0,  // Real strings decay naturally to silence! NO synth drone!
            release: 0.4
          }
        });
        this.resonanceSynth.volume.value = -3.5;
        this.resonanceSynth.maxPolyphony = 12;
        this.resonanceSynth.connect(this.bodyFilter);
      }

      _getPluckVoice() {
        if (this.pluckVoices.length === 0) return null;
        const voice = this.pluckVoices[this.voiceIndex];
        this.voiceIndex = (this.voiceIndex + 1) % this.pluckVoices.length;
        return voice;
      }

      triggerAttack(notes, time = Tone.now(), velocity = 0.85) {
        const noteArray = Array.isArray(notes) ? notes : [notes];
        const now = typeof time === 'number' ? time : Tone.now();

        // Natural finger/pick brush spread across strings (14ms per string)
        noteArray.forEach((note, idx) => {
          const stringTime = now + (noteArray.length > 1 ? idx * 0.014 : 0);
          const voice = this._getPluckVoice();
          if (voice) {
            try {
              voice.triggerAttack(note, stringTime);
            } catch (e) {}
          }
        });

        try {
          this.resonanceSynth.triggerAttack(noteArray, now, velocity);
        } catch (e) {}
      }

      triggerRelease(notes, time = Tone.now()) {
        try {
          this.resonanceSynth.triggerRelease(notes, time);
        } catch (e) {}
        this.pluckVoices.forEach(v => {
          try {
            v.triggerRelease(time);
          } catch (e) {}
        });
      }

      triggerAttackRelease(notes, duration = '1m', time = Tone.now(), velocity = 0.85) {
        const noteArray = Array.isArray(notes) ? notes : [notes];
        const now = typeof time === 'number' ? time : Tone.now();

        noteArray.forEach((note, idx) => {
          const stringTime = now + (noteArray.length > 1 ? idx * 0.016 : 0);
          const voice = this._getPluckVoice();
          if (voice) {
            try {
              voice.triggerAttack(note, stringTime);
            } catch (e) {}
          }
        });

        try {
          this.resonanceSynth.triggerAttackRelease(noteArray, duration, now, velocity);
        } catch (e) {}
      }

      releaseAll(time = Tone.now()) {
        try {
          this.resonanceSynth.releaseAll(time);
        } catch (e) {}
        this.pluckVoices.forEach(v => {
          try {
            v.triggerRelease(time);
          } catch (e) {}
        });
      }

      connect(destination) {
        this.bodyEQ.connect(destination);
        return this;
      }
    }

    // ============================================================================
    // DEDICATED CONCERT GRAND PIANO ENGINE
    // FM Acoustic Piano Physics: Felt Hammer Strike + Spruce Soundboard Resonance
    // ============================================================================
    class GrandPianoEngine {
      constructor(roomReverb) {
        this.name = 'GrandPianoEngine';
        this.roomReverb = roomReverb;

        // 1. Piano spruce soundboard & wooden rim EQ/Filter
        this.soundboardEQ = new Tone.EQ3({
          low: 4.2,      // Deep 150Hz spruce soundboard & cast-iron plate authority
          mid: 2.0,      // Felt hammer attack transient clarity around 2.4kHz
          high: -3.0,    // Softens upper digital harmonics for warm concert hall realism
          lowFrequency: 180,
          highFrequency: 5500
        });

        this.pianoFilter = new Tone.Filter({
          frequency: 6400,
          type: 'lowpass',
          rolloff: -12,
          Q: 1.0
        });

        this.pianoFilter.connect(this.soundboardEQ);
        if (this.roomReverb) {
          this.soundboardEQ.connect(this.roomReverb);
        }

        // 2. High-Fidelity FM Acoustic Piano Synth Engine:
        this.pianoSynth = new Tone.PolySynth(Tone.FMSynth, {
          harmonicity: 1.0,
          modulationIndex: 4.6, // Rich wooden felt hammer strike
          oscillator: {
            type: 'sine' // Pure fundamental string tone
          },
          envelope: {
            attack: 0.002, // Crisp felt hammer strike
            decay: 3.2,    // Long singing grand piano decay
            sustain: 0.02, // Acoustic piano naturally fades (never drones like an organ!)
            release: 0.55  // Felt dampers falling on strings
          },
          modulation: {
            type: 'triangle' // Rich hammer strike harmonic series
          },
          modulationEnvelope: {
            attack: 0.001, // Immediate hammer impact transient
            decay: 0.16,   // Hammer impact rapidly dampens in 160ms
            sustain: 0.01, // Leaves clean singing string
            release: 0.25
          }
        });

        this.pianoSynth.volume.value = 2.5;
        this.pianoSynth.maxPolyphony = 12;
        this.pianoSynth.connect(this.pianoFilter);
      }

      triggerAttack(notes, time = Tone.now(), velocity = 0.85) {
        const noteArray = Array.isArray(notes) ? notes : [notes];
        const now = typeof time === 'number' ? time : Tone.now();
        try {
          this.pianoSynth.triggerAttack(noteArray, now, velocity);
        } catch (e) {}
      }

      triggerRelease(notes, time = Tone.now()) {
        try {
          this.pianoSynth.triggerRelease(notes, time);
        } catch (e) {}
      }

      triggerAttackRelease(notes, duration = '2n', time = Tone.now(), velocity = 0.85) {
        const noteArray = Array.isArray(notes) ? notes : [notes];
        const now = typeof time === 'number' ? time : Tone.now();
        try {
          this.pianoSynth.triggerAttackRelease(noteArray, duration, now, velocity);
        } catch (e) {}
      }

      releaseAll(time = Tone.now()) {
        try {
          this.pianoSynth.releaseAll(time);
        } catch (e) {}
      }

      connect(destination) {
        this.soundboardEQ.connect(destination);
        return this;
      }
    }

    // SOUND ENGINE
    class SoundEngineStandalone {
      constructor() {
        this.isInitialized = false;
        this.rootKey = 'C';
        this.scaleType = 'major';
        this.octave = 4;
        this.activeNotes = [];
        this.instruments = {};
        this.currentInstrument = 'ambientPad';
        this.activeChord = null;
        this.intensity = 0.85;

        // Theremin state
        this.thereminSynth = null;
        this.thereminGain = null;
        this.thereminVibrato = null;
        this.isThereminPlaying = false;
      }

      async init() {
        if (this.isInitialized) return;
        await Tone.start();
        const ctx = Tone.getContext().rawContext;
        this.recordingDestination = ctx.createMediaStreamDestination();

        // Limiter & Analyzer
        this.limiter = new Tone.Limiter(-1).toDestination();
        this.analyzer = new Tone.Analyser('fft', 32);
        this.masterVolume = new Tone.Volume(-4).connect(this.analyzer);
        this.analyzer.connect(this.limiter);
        Tone.connect(this.masterVolume, this.recordingDestination);

        // Dynamic Master Filter
        this.filter = new Tone.Filter(5500, 'lowpass').connect(this.masterVolume);

        // Ambient Reverb (Pad & Strings)
        this.ambientReverb = new Tone.Reverb({ decay: 4.2, wet: 0.38 }).connect(this.filter);
        await this.ambientReverb.generate();

        // Room Reverb (Clean Piano & Guitar)
        this.roomReverb = new Tone.Reverb({ decay: 1.6, wet: 0.22 }).connect(this.filter);
        await this.roomReverb.generate();

        // Chorus (Dream Synth)
        this.chorus = new Tone.Chorus({ frequency: 2, delayTime: 3, depth: 0.7, wet: 0.3 }).start().connect(this.ambientReverb);

        // 1. Ambient Vocal Pad
        this.instruments.ambientPad = new Tone.PolySynth(Tone.Synth, {
          oscillator: { type: 'fatsawtooth', count: 3, spread: 25 },
          envelope: { attack: 0.05, decay: 1.2, sustain: 0.85, release: 2.0 }
        }).connect(this.chorus);
        this.instruments.ambientPad.maxPolyphony = 12;

        // 2. Acoustic Grand Piano (Clean felt hammer FM attack, spruce soundboard, room reverb)
        this.instruments.grandPiano = new GrandPianoEngine(this.roomReverb);

        // 3. Acoustic Guitar Pluck (Karplus-Strong physical plucked string models)
        this.instruments.acousticGuitar = new AcousticGuitarEngine(this.roomReverb);

        // 4. 80s Dream Synth (Warm detuned analog saw)
        this.instruments.dreamSynth = new Tone.PolySynth(Tone.Synth, {
          oscillator: { type: 'fmsawtooth' },
          envelope: { attack: 0.04, decay: 0.6, sustain: 0.65, release: 1.1 }
        }).connect(this.chorus);
        this.instruments.dreamSynth.maxPolyphony = 12;

        // 5. Warm Cello & Strings (Bowed orchestral swell)
        this.instruments.warmStrings = new Tone.PolySynth(Tone.Synth, {
          oscillator: { type: 'fatsawtooth', count: 2, spread: 18 },
          envelope: { attack: 0.08, decay: 0.8, sustain: 0.95, release: 1.8 }
        }).connect(this.ambientReverb);
        this.instruments.warmStrings.maxPolyphony = 12;

        // 6. Celesta Bell Harp
        this.instruments.celesta = new Tone.PolySynth(Tone.FMSynth, {
          harmonicity: 3.002,
          modulationIndex: 9.0,
          oscillator: { type: 'sine' },
          envelope: { attack: 0.001, decay: 2.4, sustain: 0.0, release: 1.8 },
          modulation: { type: 'sine' },
          modulationEnvelope: { attack: 0.001, decay: 0.8, sustain: 0.0, release: 0.8 }
        }).connect(this.ambientReverb);
        this.instruments.celesta.maxPolyphony = 12;

        // 7. Theremin Lead Synth Voice
        this.instruments.theremin = new Tone.PolySynth(Tone.Synth, {
          oscillator: { type: 'sine' },
          envelope: { attack: 0.08, decay: 0.2, sustain: 0.95, release: 0.5 },
          portamento: 0.06
        }).connect(this.masterVolume);
        this.instruments.theremin.maxPolyphony = 4;

        // Dedicated Continuous Theremin Lead
        this.thereminGain = new Tone.Gain(0).connect(this.masterVolume);
        this.thereminVibrato = new Tone.Vibrato({ frequency: 5.5, depth: 0.15 }).connect(this.thereminGain);
        this.thereminSynth = new Tone.Synth({
          oscillator: { type: 'sine' },
          envelope: { attack: 0.05, decay: 0.1, sustain: 1.0, release: 0.25 },
          portamento: 0.04
        }).connect(this.thereminVibrato);

        this.activeChord = this.getChordForDegree(1);
        this.isInitialized = true;
      }

      getActiveInstrument() {
        return this.instruments[this.currentInstrument] || this.instruments.ambientPad;
      }

      setInstrument(name) {
        if (this.currentInstrument === name && this.instruments[name]) return;
        this.stopAllNotes();
        this.currentInstrument = name;
        if (name === 'theremin') return;
        if (this.isInitialized) {
          const chord = this.activeChord || this.getChordForDegree(1);
          if (chord) this.playChord(chord, 0.85);
        }
      }

      setIntensity(val) {
        const clamped = Math.max(0.08, Math.min(1.0, val));
        this.intensity = clamped;
        if (this.filter) {
          const cutoff = 300 + Math.pow(clamped, 2) * 15500;
          this.filter.frequency.rampTo(cutoff, 0.06);
        }
        if (this.masterVolume) {
          const dbOffset = (clamped - 0.7) * 8;
          this.masterVolume.volume.rampTo(-4 + dbOffset, 0.06);
        }
      }

      setFilterCutoff(hz) {
        if (this.filter) {
          this.filter.frequency.rampTo(Math.max(200, Math.min(16000, hz)), 0.08);
        }
      }

      startTheremin(freqHz = 440, volNorm = 0.7) {
        if (!this.isInitialized) return;
        const clampedFreq = Math.max(80, Math.min(2200, freqHz));
        if (!this.isThereminPlaying) {
          try { this.thereminSynth.triggerAttack(clampedFreq); } catch(e){}
          this.isThereminPlaying = true;
        } else {
          this.thereminSynth.frequency.rampTo(clampedFreq, 0.03);
        }
        this.thereminGain.gain.rampTo(Math.max(0, Math.min(1.0, volNorm * this.intensity)), 0.05);
      }

      updateTheremin(freqHz, volNorm = 0.7) {
        if (!this.isInitialized) return;
        const clampedFreq = Math.max(80, Math.min(2200, freqHz));
        if (!this.isThereminPlaying) {
          this.startTheremin(clampedFreq, volNorm);
          return;
        }
        this.thereminSynth.frequency.rampTo(clampedFreq, 0.03);
        this.thereminGain.gain.rampTo(Math.max(0, Math.min(1.0, volNorm * this.intensity)), 0.04);
      }

      stopTheremin() {
        if (!this.isInitialized || !this.isThereminPlaying) return;
        this.thereminGain.gain.rampTo(0, 0.06);
        setTimeout(() => {
          if (this.isThereminPlaying) {
            try { this.thereminSynth.triggerRelease(); } catch(e){}
            this.isThereminPlaying = false;
          }
        }, 70);
      }

      getChordForDegree(degreeIndex) {
        const scale = SCALES[this.scaleType] || SCALES.major;
        const count = scale.intervals.length;
        const zeroIndex = (degreeIndex - 1) % count;

        const rootOffset = scale.intervals[zeroIndex];
        const thirdOffset = scale.intervals[(zeroIndex + 2) % count];
        const fifthOffset = scale.intervals[(zeroIndex + 4) % count];

        const rootMidi = Tone.Frequency(`${this.rootKey}${this.octave}`).toMidi();
        const n1 = Tone.Frequency(rootMidi + rootOffset, 'midi').toNote();
        const n3 = Tone.Frequency(rootMidi + (thirdOffset < rootOffset ? thirdOffset + 12 : thirdOffset), 'midi').toNote();
        const n5 = Tone.Frequency(rootMidi + (fifthOffset < rootOffset ? fifthOffset + 12 : fifthOffset), 'midi').toNote();
        const bass = Tone.Frequency(rootMidi + rootOffset - 12, 'midi').toNote();

        const quality = scale.chordQualities[zeroIndex];
        const chordName = `${n1.replace(/\d/, '')}${quality === 'min' ? 'm' : quality === 'dim' ? '°' : ''}`;

        const chord = {
          name: chordName,
          degree: scale.degrees[zeroIndex],
          notes: [bass, n1, n3, n5]
        };
        return chord;
      }

      getChordFromFingerCount(count) {
        if (count <= 0) return null;
        const map = [1, 4, 5, 6, 2];
        const deg = map[count - 1] || 1;
        const chord = this.getChordForDegree(deg);
        if (chord) this.activeChord = chord;
        return chord;
      }

      playChord(chordData, velocity = 0.8) {
        if (!this.isInitialized) return;
        const targetChord = chordData || this.activeChord || this.getChordForDegree(1);
        if (!targetChord) return;
        this.activeChord = targetChord;
        const inst = this.getActiveInstrument();
        if (this.activeNotes.length > 0) {
          try { inst.triggerRelease(this.activeNotes); } catch(e){}
        }
        this.activeNotes = targetChord.notes;
        inst.triggerAttack(this.activeNotes, Tone.now(), velocity * this.intensity);
      }

      strumChord(chordData, direction = 'down') {
        if (!this.isInitialized) return;
        const targetChord = chordData || this.activeChord || this.getChordForDegree(1);
        if (!targetChord) return;
        this.activeChord = targetChord;
        const inst = this.getActiveInstrument();
        const notesToStrum = direction === 'down' ? [...targetChord.notes] : [...targetChord.notes].reverse();
        const now = Tone.now();
        if (this.activeNotes.length > 0) {
          try { inst.triggerRelease(this.activeNotes); } catch(e){}
          this.activeNotes = [];
        }
        notesToStrum.forEach((n, idx) => {
          inst.triggerAttackRelease(n, '1m', now + (idx * 0.035), 0.88 * this.intensity);
        });
      }

      stopAllNotes() {
        if (!this.isInitialized) return;
        Object.keys(this.instruments).forEach(k => {
          try { if (this.instruments[k]?.releaseAll) this.instruments[k].releaseAll(); } catch(e){}
        });
        this.activeNotes = [];
      }

      getAnalyzerData() {
        return this.analyzer ? this.analyzer.getValue() : null;
      }
    }

    const soundEngine = new SoundEngineStandalone();

    // Distance helper
    function getDist(p1, p2) {
      const dx = p1.x - p2.x, dy = p1.y - p2.y;
      return Math.sqrt(dx*dx + dy*dy);
    }

    function analyzeFingers(landmarks, handedness, isMirrored) {
      const wrist = landmarks[0];
      const scale = Math.max(0.02, getDist(wrist, landmarks[9]));

      const isIndex = getDist(landmarks[8], wrist) > getDist(landmarks[6], wrist) && getDist(landmarks[8], landmarks[5]) > getDist(landmarks[6], landmarks[5]) * 0.95 && getDist(landmarks[8], wrist) > scale * 1.05;
      const isMiddle = getDist(landmarks[12], wrist) > getDist(landmarks[10], wrist) && getDist(landmarks[12], landmarks[9]) > getDist(landmarks[10], landmarks[9]) * 0.95 && getDist(landmarks[12], wrist) > scale * 1.05;
      const isRing = getDist(landmarks[16], wrist) > getDist(landmarks[14], wrist) && getDist(landmarks[16], landmarks[13]) > getDist(landmarks[14], landmarks[13]) * 0.95 && getDist(landmarks[16], wrist) > scale * 1.00;
      const isPinky = getDist(landmarks[20], wrist) > getDist(landmarks[18], wrist) && getDist(landmarks[20], landmarks[17]) > getDist(landmarks[18], landmarks[17]) * 0.95 && getDist(landmarks[20], wrist) > scale * 0.92;
      const isThumb = getDist(landmarks[4], landmarks[5]) > scale * 0.42 && getDist(landmarks[4], landmarks[17]) > getDist(landmarks[2], landmarks[17]) * 1.05;

      const ext4 = [isIndex, isMiddle, isRing, isPinky].filter(Boolean).length;
      let count = 0;
      if (ext4 === 0 && !isThumb) count = 0;
      else if (ext4 === 1 && isIndex) count = 1;
      else if (ext4 === 2 && isIndex && isMiddle) count = 2;
      else if (ext4 === 3 && isIndex && isMiddle && isRing) count = 3;
      else if (ext4 === 2 && isThumb && isIndex && isMiddle) count = 3;
      else if (ext4 === 4 && !isThumb) count = 4;
      else if (ext4 === 4 && isThumb) count = 5;
      else if (ext4 === 4) count = 4;
      else count = ext4 + (isThumb ? 1 : 0);

      const pinchDist = getDist(landmarks[4], landmarks[8]);
      const isPinch = pinchDist < 0.065;
      const pinchIntensity = Math.max(0.12, Math.min(1.0, (pinchDist - 0.02) / 0.13));
      const center = {
        x: (landmarks[0].x + landmarks[5].x + landmarks[17].x) / 3,
        y: (landmarks[0].y + landmarks[5].y + landmarks[17].y) / 3
      };

      let finalHand = isMirrored ? (handedness === 'Left' ? 'Right' : 'Left') : handedness;

      return {
        hand: finalHand,
        landmarks,
        extendedCount: count,
        isPinch,
        pinchIntensity,
        center,
        isFist: count === 0
      };
    }

    // MAIN COMPONENT
    function App() {
      const videoRef = useRef(null);
      const canvasRef = useRef(null);
      const handsRef = useRef(null);
      const [audioEnabled, setAudioEnabled] = useState(false);
      const [currentChord, setCurrentChord] = useState(null);
      const [handsCount, setHandsCount] = useState(0);
      const [isMirrored, setIsMirrored] = useState(true);
      const [instrument, setInstrument] = useState('ambientPad');
      const [currentKey, setCurrentKey] = useState('C');
      const [isRecording, setIsRecording] = useState(false);
      const [recordedUrl, setRecordedUrl] = useState(null);
      const mediaRecorderRef = useRef(null);
      const recordedChunksRef = useRef([]);

      const latestHandsRef = useRef([]);
      const lastStrumYRef = useRef(0);
      const lastChordRef = useRef(null);

      // Start Camera & MediaPipe
      useEffect(() => {
        let stream = null;

        async function setup() {
          try {
            stream = await navigator.mediaDevices.getUserMedia({
              video: { width: 1280, height: 720, facingMode: 'user' },
              audio: true
            });
            if (videoRef.current) {
              videoRef.current.srcObject = stream;
              await videoRef.current.play();
            }

            const HandsClass = window.Hands;
            if (HandsClass) {
              const hands = new HandsClass({
                locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
              });

              hands.setOptions({
                maxNumHands: 2,
                modelComplexity: 0,
                minDetectionConfidence: 0.55,
                minTrackingConfidence: 0.55
              });

              hands.onResults((results) => {
                if (!results.multiHandLandmarks || results.multiHandLandmarks.length === 0) {
                  latestHandsRef.current = [];
                  setHandsCount(0);
                  if (soundEngine.isInitialized) {
                    soundEngine.stopAllNotes();
                    setCurrentChord(null);
                    lastChordRef.current = null;
                  }
                  return;
                }

                const list = [];
                let leftHand = null;
                let rightHand = null;

                results.multiHandLandmarks.forEach((lms, idx) => {
                  const rawLabel = results.multiHandedness && results.multiHandedness[idx] ? results.multiHandedness[idx].label : 'Right';
                  const analyzed = analyzeFingers(lms, rawLabel, true);
                  list.push(analyzed);
                  if (analyzed.hand === 'Left') leftHand = analyzed;
                  else rightHand = analyzed;
                });

                latestHandsRef.current = list;
                setHandsCount(list.length);

                // Music control logic: Seamless dual-hand chords (Left OR Right Hand!)
                if (soundEngine.isInitialized) {
                  const chordHand = (leftHand && leftHand.extendedCount > 0) ? leftHand : ((rightHand && rightHand.extendedCount > 0) ? rightHand : null);
                  const expHand = (chordHand === leftHand) ? rightHand : leftHand;

                  if (chordHand) {
                    if (chordHand.isFist) {
                      soundEngine.stopAllNotes();
                      setCurrentChord(null);
                      lastChordRef.current = null;
                    } else if (chordHand.extendedCount > 0) {
                      const chord = soundEngine.getChordFromFingerCount(chordHand.extendedCount);
                      if (chord && (!lastChordRef.current || lastChordRef.current.name !== chord.name)) {
                        soundEngine.playChord(chord, 0.85);
                        setCurrentChord(chord);
                        lastChordRef.current = chord;
                      }
                    }
                  } else if ((leftHand && leftHand.isFist) || (rightHand && rightHand.isFist)) {
                    soundEngine.stopAllNotes();
                    setCurrentChord(null);
                    lastChordRef.current = null;
                  }

                  // Expression & Air Strum on opposite hand
                  if (expHand) {
                    if (expHand.extendedCount <= 1) {
                      soundEngine.setIntensity(expHand.pinchIntensity);
                    }
                    const heightY = 1.0 - expHand.center.y;
                    soundEngine.setFilterCutoff(300 + Math.pow(heightY, 2) * 15000);

                    const dy = expHand.center.y - lastStrumYRef.current;
                    if (Math.abs(dy) > 0.065) {
                      const chordToStrum = lastChordRef.current || soundEngine.activeChord || soundEngine.getChordForDegree(1);
                      soundEngine.strumChord(chordToStrum, dy > 0 ? 'down' : 'up');
                      setCurrentChord(chordToStrum);
                    }
                    lastStrumYRef.current = expHand.center.y;
                  }
                }
              });

              handsRef.current = hands;

              // AI Frame loop
              const processFrame = async () => {
                if (videoRef.current && videoRef.current.readyState >= 2 && handsRef.current) {
                  try {
                    await handsRef.current.send({ image: videoRef.current });
                  } catch(e){}
                }
                setTimeout(processFrame, 30);
              };
              processFrame();
            }

            // 60 FPS Render loop
            const render = () => {
              const canvas = canvasRef.current;
              const video = videoRef.current;
              if (canvas && video && video.readyState >= 2) {
                const ctx = canvas.getContext('2d');
                const w = canvas.width, h = canvas.height;

                ctx.save();
                ctx.translate(w, 0);
                ctx.scale(-1, 1);
                ctx.drawImage(video, 0, 0, w, h);
                ctx.restore();

                // Dark tint
                ctx.fillStyle = 'rgba(10, 15, 26, 0.2)';
                ctx.fillRect(0, 0, w, h);

                // Draw audio visualizer
                const freq = soundEngine.isInitialized ? soundEngine.getAnalyzerData() : null;
                if (freq) {
                  const barCount = 24, bw = 8, gap = 4;
                  const startX = (w - barCount * (bw + gap)) / 2;
                  for (let i = 0; i < barCount; i++) {
                    const db = freq[i] || -100;
                    const norm = Math.max(0, Math.min(1, (db + 90) / 70));
                    const bh = Math.max(3, norm * 40);
                    ctx.fillStyle = '#00f3ff';
                    ctx.fillRect(startX + i * (bw + gap), h - 20 - bh, bw, bh);
                  }
                }

                // Draw Hand Skeletons
                latestHandsRef.current.forEach(handData => {
                  const isLeft = handData.hand === 'Left';
                  ctx.lineWidth = 3;
                  ctx.strokeStyle = isLeft ? 'rgba(0, 243, 255, 0.75)' : 'rgba(255, 45, 117, 0.75)';

                  HAND_CONNECTIONS.forEach(([s, e]) => {
                    const p1 = handData.landmarks[s];
                    const p2 = handData.landmarks[e];
                    ctx.beginPath();
                    ctx.moveTo((1 - p1.x) * w, p1.y * h);
                    ctx.lineTo((1 - p2.x) * w, p2.y * h);
                    ctx.stroke();
                  });

                  handData.landmarks.forEach((p, idx) => {
                    ctx.beginPath();
                    ctx.arc((1 - p.x) * w, p.y * h, [4,8,12,16,20].includes(idx) ? 6 : 3.5, 0, Math.PI * 2);
                    ctx.fillStyle = isLeft ? '#00f3ff' : '#ff2d75';
                    ctx.fill();
                  });
                });

                // Watermark
                ctx.font = '600 12px "Outfit", sans-serif';
                ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
                ctx.fillText('AIRSYMPHONY • VOCAL & GESTURE STUDIO', 16, h - 16);
              }
              requestAnimationFrame(render);
            };
            render();

          } catch(err) {
            console.error('Camera error:', err);
          }
        }

        setup();

        return () => {
          if (stream) stream.getTracks().forEach(t => t.stop());
        };
      }, []);

      const enableSound = async () => {
        await soundEngine.init();
        setAudioEnabled(true);
      };

      const selectInst = (id) => {
        setInstrument(id);
        soundEngine.setInstrument(id);
      };

      // Recording
      const startRec = async () => {
        if (!audioEnabled) await enableSound();
        const canvas = canvasRef.current;
        const video = videoRef.current;
        if (!canvas || !video) return;

        const canvasStream = canvas.captureStream(30);
        const synthStream = soundEngine.recordingDestination ? soundEngine.recordingDestination.stream : null;

        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        const actx = new AudioCtx();
        const dest = actx.createMediaStreamDestination();

        if (video.srcObject) {
          const micSource = actx.createMediaStreamSource(video.srcObject);
          micSource.connect(dest);
        }
        if (synthStream) {
          const synthSource = actx.createMediaStreamSource(synthStream);
          synthSource.connect(dest);
        }

        const combined = new MediaStream([
          ...canvasStream.getVideoTracks(),
          ...dest.stream.getAudioTracks()
        ]);

        recordedChunksRef.current = [];
        const mr = new MediaRecorder(combined, { mimeType: 'video/webm' });
        mr.ondataavailable = (e) => {
          if (e.data.size > 0) recordedChunksRef.current.push(e.data);
        };
        mr.onstop = () => {
          const blob = new Blob(recordedChunksRef.current, { type: 'video/webm' });
          const url = URL.createObjectURL(blob);
          setRecordedUrl(url);
          confetti({ particleCount: 70, spread: 60, origin: { y: 0.6 } });
        };

        mr.start(1000);
        mediaRecorderRef.current = mr;
        setIsRecording(true);
      };

      const stopRec = () => {
        if (mediaRecorderRef.current && isRecording) {
          mediaRecorderRef.current.stop();
          setIsRecording(false);
        }
      };

      return (
        <div className="flex-1 max-w-6xl w-full mx-auto p-4 flex flex-col gap-4">
          
          {/* Header */}
          <header className="flex items-center justify-between py-2 border-b border-slate-800">
            <div className="flex items-center gap-2">
              <div className="w-8 h-8 rounded-lg bg-gradient-to-tr from-cyan-400 to-pink-500 flex items-center justify-center font-bold text-white text-sm">
                AS
              </div>
              <h1 className="text-xl font-bold tracking-tight">
                Air<span className="text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-pink-400">Symphony</span>
                <span className="text-xs ml-2 px-2 py-0.5 rounded-full bg-cyan-950 border border-cyan-500/40 text-cyan-300 font-mono">STANDALONE</span>
              </h1>
            </div>

            <div className="flex items-center gap-3 text-xs">
              <span className={`px-2 py-1 rounded-md border ${handsCount > 0 ? 'bg-cyan-950 border-cyan-500 text-cyan-300' : 'bg-slate-900 border-slate-800 text-slate-500'}`}>
                Hands: {handsCount}/2
              </span>
              <span className="px-2 py-1 rounded-md bg-purple-950 border border-purple-500 text-purple-300 font-mono font-bold">
                Key of {currentKey}
              </span>
            </div>
          </header>

          {/* Viewport */}
          <div className="relative aspect-video rounded-2xl overflow-hidden bg-slate-900 border border-slate-800 shadow-2xl flex items-center justify-center">
            <video ref={videoRef} playsInline autoPlay muted className="hidden" />
            <canvas ref={canvasRef} width={1280} height={720} className="w-full h-full object-contain" />

            {!audioEnabled && (
              <div className="absolute inset-0 bg-slate-950/80 backdrop-blur-sm flex flex-col items-center justify-center p-6 text-center z-20">
                <h2 className="text-2xl font-bold mb-2">Welcome to AirSymphony Studio</h2>
                <p className="text-sm text-slate-400 max-w-md mb-4">
                  Accompany your vocal singing effortlessly with hand gestures. Click below to start the Web Audio engine!
                </p>
                <button
                  onClick={enableSound}
                  className="px-6 py-3 rounded-xl bg-gradient-to-r from-cyan-500 to-purple-600 hover:from-cyan-400 hover:to-purple-500 text-white font-bold text-sm tracking-wide shadow-lg shadow-cyan-500/30"
                >
                  ENABLE SOUND & START SINGING
                </button>
              </div>
            )}

            {currentChord && (
              <div className="absolute top-4 right-4 glass-panel-accent px-4 py-2 rounded-xl flex items-center gap-2 border border-cyan-400/40 shadow-xl">
                <span className="w-2.5 h-2.5 rounded-full bg-cyan-400 animate-pulse"></span>
                <span className="text-xs text-slate-400">Chord:</span>
                <span className="text-xl font-bold font-mono text-white text-glow-cyan">{currentChord.name}</span>
              </div>
            )}
          </div>

          {/* Controls Bar */}
          <div className="bg-slate-900/90 border border-slate-800 p-3 rounded-xl flex items-center justify-between">
            <div className="flex items-center gap-2 text-xs text-slate-400">
              <span className="w-2 h-2 rounded-full bg-cyan-400"></span>
              <span>Left Hand: 1-5 fingers for chords</span>
              <span className="text-slate-600">|</span>
              <span className="w-2 h-2 rounded-full bg-pink-400"></span>
              <span>Right Hand: Wave down to strum</span>
            </div>

            <div>
              {!isRecording ? (
                <button
                  onClick={startRec}
                  className="px-5 py-2 rounded-full bg-rose-600 hover:bg-rose-500 text-white font-bold text-xs flex items-center gap-2 shadow-lg shadow-rose-600/30"
                >
                  <span className="w-3 h-3 rounded-full bg-white animate-pulse"></span>
                  RECORD PERFORMANCE
                </button>
              ) : (
                <button
                  onClick={stopRec}
                  className="px-5 py-2 rounded-full bg-red-600 text-white font-bold text-xs flex items-center gap-2 animate-pulse"
                >
                  <span className="w-3 h-3 bg-white"></span>
                  STOP & PREVIEW
                </button>
              )}
            </div>
          </div>

          {/* Instruments */}
          <div className="glass-panel p-4 rounded-xl border border-slate-800">
            <div className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Select Accompaniment Instrument</div>
            <div className="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-7 gap-2">
              {[
                { id: 'ambientPad', name: 'Ambient Vocal Pad' },
                { id: 'grandPiano', name: 'Acoustic Piano' },
                { id: 'acousticGuitar', name: 'Acoustic Guitar' },
                { id: 'dreamSynth', name: '80s Dream Synth' },
                { id: 'warmStrings', name: 'Warm Strings' },
                { id: 'celesta', name: 'Celesta & Bell Harp' },
                { id: 'theremin', name: 'Theremin Lead' }
              ].map(inst => (
                <button
                  key={inst.id}
                  onClick={() => selectInst(inst.id)}
                  className={`p-2.5 rounded-lg border text-xs font-semibold text-left transition-all ${
                    instrument === inst.id
                      ? 'bg-cyan-950 border-cyan-400 text-white shadow-md'
                      : 'bg-slate-900 border-slate-800 text-slate-400 hover:bg-slate-800'
                  }`}
                >
                  {inst.name}
                </button>
              ))}
            </div>
          </div>

          {/* Recorded Take Preview Modal */}
          {recordedUrl && (
            <div className="fixed inset-0 bg-slate-950/85 backdrop-blur-md flex items-center justify-center p-4 z-50">
              <div className="bg-slate-900 border border-slate-800 rounded-2xl max-w-2xl w-full p-5 space-y-4 shadow-2xl">
                <div className="flex justify-between items-center">
                  <h3 className="font-bold text-lg">Your Performance Recording</h3>
                  <button onClick={() => setRecordedUrl(null)} className="text-slate-400 hover:text-white font-bold">✕</button>
                </div>
                <video src={recordedUrl} controls autoPlay className="w-full aspect-video rounded-xl bg-black" />
                <div className="flex justify-end gap-2">
                  <button onClick={() => setRecordedUrl(null)} className="px-4 py-2 bg-slate-800 text-slate-300 rounded-lg text-xs font-semibold">Discard</button>
                  <a href={recordedUrl} download="AirSymphony_Performance.webm" className="px-5 py-2 bg-cyan-600 hover:bg-cyan-500 text-white rounded-lg text-xs font-bold flex items-center gap-2">
                    ⬇️ DOWNLOAD VIDEO
                  </a>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
